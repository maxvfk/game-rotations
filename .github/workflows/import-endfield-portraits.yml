name: One-time import Endfield portrait assets
on:
  push:
    branches: [feat/endfield-portrait-catalog]
    paths:
      - data/portraits/arknights-endfield.json
      - scripts/import-endfield-portraits.mjs
      - .github/workflows/import-endfield-portraits.yml
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/endfield-portrait-catalog
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download and validate snapshot PNGs by SHA-256
        run: node scripts/import-endfield-portraits.mjs
      - name: Commit original icons to feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/portraits/arknights-endfield/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "assets(endfield): preserve 34 verified original charicon PNGs"
          git push origin HEAD:feat/endfield-portrait-catalog
